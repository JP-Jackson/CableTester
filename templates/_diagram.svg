<svg class="diagram" viewBox="0 0 440 340" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">DB9 loopback plug wiring</title>
  <desc id="diagram-desc">Pin 2 joined to pin 3, pin 7 joined to pin 8, pins 4, 1 and 6 joined together. Pin 5 is signal ground with no jumper, pin 9 is unused.</desc>

  <!-- D-shell -->
  <path class="shell" d="M 30 76 L 410 76 L 392 218 L 48 218 Z"/>
  <path class="shell-inner" d="M 44 90 L 396 90 L 382 204 L 58 204 Z"/>

  <!-- jumpers (drawn under the pins so the pads sit on top) -->
  <g class="jumpers" fill="none">
    <path class="jw j-modem" d="M 294 112 C 294 16 72 16 72 112"/>
    <path class="jw j-modem" d="M 72 112 L 109 170"/>
    <path class="jw j-data"  d="M 146 112 C 146 50 220 50 220 112"/>
    <path class="jw j-flow"  d="M 183 170 C 183 252 257 252 257 170"/>
  </g>

  <!-- pins: top row 1-5, bottom row 6-9 -->
  <g class="pins">
    <g class="pin" id="pin-1"><circle cx="72"  cy="112" r="14"/><text x="72"  y="117">1</text></g>
    <g class="pin" id="pin-2"><circle cx="146" cy="112" r="14"/><text x="146" y="117">2</text></g>
    <g class="pin" id="pin-3"><circle cx="220" cy="112" r="14"/><text x="220" y="117">3</text></g>
    <g class="pin" id="pin-4"><circle cx="294" cy="112" r="14"/><text x="294" y="117">4</text></g>
    <g class="pin" id="pin-5"><circle cx="368" cy="112" r="14"/><text x="368" y="117">5</text></g>
    <g class="pin" id="pin-6"><circle cx="109" cy="170" r="14"/><text x="109" y="175">6</text></g>
    <g class="pin" id="pin-7"><circle cx="183" cy="170" r="14"/><text x="183" y="175">7</text></g>
    <g class="pin" id="pin-8"><circle cx="257" cy="170" r="14"/><text x="257" y="175">8</text></g>
    <g class="pin" id="pin-9"><circle cx="331" cy="170" r="14"/><text x="331" y="175">9</text></g>
  </g>

  <!-- signal names -->
  <g class="siglabels">
    <text x="72"  y="140">DCD</text>
    <text x="146" y="140">RXD</text>
    <text x="220" y="140">TXD</text>
    <text x="294" y="140">DTR</text>
    <text x="368" y="140">GND</text>
    <text x="109" y="197">DSR</text>
    <text x="183" y="197">RTS</text>
    <text x="257" y="197">CTS</text>
    <text x="331" y="197">RI</text>
  </g>

  <g class="caption">
    <text x="220" y="284">Mating face of a MALE shell — a female shell mirrors left to right.</text>
    <text x="220" y="300">Pin numbers are moulded into the plastic: go by those, not by position.</text>
    <text x="220" y="326" class="cap-key">
      <tspan class="k-data">■</tspan> 2–3 data
      <tspan class="k-flow">■</tspan> 7–8 flow
      <tspan class="k-modem">■</tspan> 4–1–6 modem
      <tspan class="k-none">■</tspan> 9 unused
    </text>
  </g>
</svg>
