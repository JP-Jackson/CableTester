<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<title>Cable Tester HMI preview</title>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
<style>
/* HMI prototype for the 1024x600 panel. Not the instrument: no serial port is
   opened from this page and every number on it is invented. It exists so the
   layout can be judged on the panel it is for, at the distance it is read
   from, which a mockup on a laptop cannot tell you.

   Tokens are the same values as static/style.css, dark palette. Kept separate
   because the layout is different enough that sharing the stylesheet would
   mean fighting it. If this design is adopted, these merge. */
:root{
  --bg:#282d35;--bg2:#343b45;--bg3:#414957;
  --b1:rgba(255,255,255,0.12);--b2:rgba(255,255,255,0.24);
  --tx:#f5f6f7;--mu:#bcc1c8;
  --mr:#8a2a4c;--ml:#e3a9be;
  --good:#85d9a8;--wn:#e8c46f;--bad:#eea7a2;
  --wire-data:#67d5e8;--wire-flow:#7fa8f5;--wire-modem:#c4a2f5;
  --sans:'Barlow',system-ui,sans-serif;
  --disp:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --mono:ui-monospace,'DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;user-select:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* The whole point: the app is exactly the viewport and never scrolls. */
.hmi{width:100vw;height:100vh;display:flex;overflow:hidden}

/* ── nav rail ─────────────────────────────────────────────────────────── */
.rail{width:126px;flex-shrink:0;background:var(--bg2);border-right:0.5px solid var(--b2);
  display:flex;flex-direction:column}
.rail .mark{height:66px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-bottom:0.5px solid var(--b1)}
.rail .items{display:flex;flex-direction:column;gap:3px;padding:8px 8px 0;min-height:0}
.navbtn{position:relative;height:78px;border-radius:10px;background:transparent;border:0;
  color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:11.5px;
  letter-spacing:.09em;transition:background .15s,color .15s}
.navbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.navbtn.on{background:var(--mr);color:var(--tx)}
.navbtn.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;
  background:var(--ml);border-radius:0 2px 2px 0}

/* ── status bar ───────────────────────────────────────────────────────── */
.main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.status{height:60px;flex-shrink:0;background:var(--bg2);border-bottom:0.5px solid var(--b2);
  display:flex;align-items:center;gap:24px;padding:0 20px}
.fld{display:flex;flex-direction:column;gap:1px}
.fld b{font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mu)}
.fld span{font-family:var(--mono);font-size:15px;color:var(--tx)}
.pill{display:flex;align-items:center;gap:8px;background:var(--bg3);border:0.5px solid var(--b2);
  border-radius:50px;padding:8px 15px;font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex-shrink:0}

/* ── screens ──────────────────────────────────────────────────────────── */
.screens{flex-grow:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;padding:16px 18px;display:none;gap:14px;overflow:hidden}
.screen.on{display:flex}
.card{background:var(--bg2);border:0.5px solid var(--b2);border-radius:10px;padding:15px;
  display:flex;flex-direction:column;min-height:0;min-width:0}
.card h2{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;
  align-items:baseline}
.card h2 em{font-style:normal;font-family:var(--sans);font-size:11px;font-weight:700;
  letter-spacing:.09em;color:var(--mu)}

/* Touch targets. 44px is the floor, primary actions get 88. */
.btn{height:56px;flex-shrink:0;border-radius:50px;border:0.5px solid var(--b2);
  background:transparent;color:var(--mu);font-family:var(--sans);font-size:14px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;transition:background .15s,color .15s,border-color .15s}
.btn.big{height:88px;flex-direction:column;gap:4px;font-size:16px}
.btn.big small{font-family:var(--sans);font-size:12px;font-weight:400;letter-spacing:.01em;
  text-transform:none;color:var(--mu)}
.btn.primary{background:var(--mr);border-color:var(--mr);color:#fff}
.btn.primary small{color:rgba(255,255,255,.74)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px}
.grow{flex-grow:1}

/* ── TEST ─────────────────────────────────────────────────────────────── */
.verdict{font-family:var(--disp);font-weight:700;font-size:29px;line-height:1.1;color:var(--wn)}
.verdict-sub{font-size:14px;line-height:1.4;color:var(--mu);margin-top:8px}

/* ── tables ───────────────────────────────────────────────────────────── */
.thead,.trow{display:flex;align-items:center}
.thead{height:28px;border-bottom:0.5px solid var(--b2);font-size:9.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.trow{height:44px;border-bottom:0.5px solid var(--b1)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:28px;
  padding:0 11px;border-radius:50px;border:0.5px solid currentColor;font-size:10.5px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.g{color:var(--good)}.w{color:var(--wn)}.r{color:var(--bad)}.m{color:var(--mu)}
.bar{flex-grow:1;height:7px;border-radius:4px;background:var(--bg3);position:relative;
  margin-right:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

/* ── modal ────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;
  justify-content:center;z-index:20}
.scrim.on{display:flex}
.modal{width:660px;max-width:94vw;background:var(--bg2);border:0.5px solid var(--b2);
  border-radius:14px;padding:20px;box-shadow:0 18px 48px rgba(0,0,0,.5)}
.modal h3{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:4px}
.modal p{font-size:13px;color:var(--mu);margin-bottom:14px}
.preset{display:flex;align-items:center;gap:14px;width:100%;height:74px;padding:0 18px;
  border-radius:10px;border:0.5px solid var(--b2);background:transparent;color:var(--tx);
  cursor:pointer;text-align:left;margin-bottom:9px;font-family:var(--sans)}
.preset.sel{border-color:var(--ml);background:var(--bg3)}
.preset .nm{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;width:118px;flex-shrink:0}
.preset .ds{font-size:12.5px;color:var(--mu);line-height:1.35;flex-grow:1}
.preset .tm{font-family:var(--mono);font-size:15px;color:var(--ml);flex-shrink:0}
.preset .tick{width:24px;flex-shrink:0;color:var(--ml);opacity:0}
.preset.sel .tick{opacity:1}

/* ── WIGGLE ───────────────────────────────────────────────────────────── */
.wig{align-items:center;justify-content:center;text-align:center;flex-grow:1;display:flex;
  flex-direction:column;gap:6px}
.wig .state{font-family:var(--disp);font-weight:800;font-size:58px;line-height:1;
  letter-spacing:.02em;color:var(--good)}
.wig.bad .state{color:var(--bad)}
.wig .count{font-family:var(--mono);font-size:76px;line-height:1;color:var(--tx)}
.wig .lbl{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mu)}
.log{height:100%;overflow:hidden;display:flex;flex-direction:column-reverse;gap:5px}
.log div{font-family:var(--mono);font-size:12.5px;color:var(--mu);flex-shrink:0}
.log div b{color:var(--bad);font-weight:400}

/* The instruction flashes because the whole test depends on the technician
   doing something, and a static line of body copy did not communicate that.
   1.4s is slow enough to read and fast enough to be unignorable. */
@keyframes prompt{0%,100%{opacity:1}50%{opacity:.3}}
.prompt{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.05;
  letter-spacing:.03em;color:var(--ml);animation:prompt 1.4s ease-in-out infinite;
  text-align:center}
.prompt small{display:block;font-family:var(--sans);font-weight:400;font-size:16px;
  letter-spacing:.01em;color:var(--mu);margin-top:7px;animation:none}

.seg{display:flex;background:var(--bg3);border:0.5px solid var(--b2);border-radius:50px;
  padding:3px;gap:3px}
.seg button{height:34px;padding:0 20px;border:0;border-radius:50px;background:transparent;
  color:var(--mu);font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--mr);color:#fff}
.sw{width:26px;height:15px;border-radius:3px;border:0.5px solid var(--b2);flex-shrink:0}
.sw.half{background:linear-gradient(105deg,#fff 0 46%,var(--c) 46% 100%)}
.sw.solid{background:var(--c)}

.note{position:absolute;right:18px;bottom:12px;font-size:10.5px;color:var(--mu);opacity:.72;
  letter-spacing:.04em}
</style>
</head>
<body>
<div class="hmi">

  <nav class="rail">
    <div class="mark">
      <svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true">
        <rect x="2" y="2" width="96" height="96" rx="22" fill="#8a2a4c"/>
        <text x="50" y="66" text-anchor="middle" font-family="Barlow Condensed, sans-serif"
              font-size="46" font-weight="800" fill="#fff" letter-spacing="1">PPT</text>
      </svg>
    </div>
    <div class="items" id="nav"></div>
  </nav>

  <div class="main">
    <div class="status">
      <!-- "Port /dev/ttyUSB0" is placeholder wording. In the kit the USB-serial
           adapter is captive, so there is nothing to choose between and the
           kernel device path means nothing to the person holding the cable.
           This becomes the adapter's identity or a plain connected indicator,
           and the underlying device gets pinned by a udev rule because
           ttyUSB0 renumbers on re-enumeration. See DOC section 12. -->
      <div class="fld"><b>Port</b><span>/dev/ttyUSB0</span></div>
      <div class="fld"><b>Cable ID</b><span>XFC-07</span></div>
      <div class="grow"></div>
      <!-- The instrument tests two kinds of cable, and their screens are
           genuinely different: nine pins versus four pairs, baud rates versus
           link speeds. So protocol is a mode switch on the instrument rather
           than more nav items, and the six nav slots carry whatever suits the
           protocol in force. -->
      <div class="seg" id="proto">
        <button class="on" data-proto="SERIAL">Serial</button>
        <button data-proto="ETHERNET">Ethernet</button>
      </div>
      <div class="pill"><span class="dot" id="dot"></span><span id="state">Ready</span></div>
    </div>
    <div class="screens" id="screens"></div>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="modal">
    <h3>Sweep settings</h3>
    <p>How hard to work the cable. Longer runs catch faults a short one misses.</p>
    <div id="presets"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn grow" onclick="closeModal()">Cancel</button>
      <button class="btn primary grow" onclick="closeModal()">Start sweep</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim2">
  <div class="modal">
    <h3 id="plan-name">Standard</h3>
    <p>Every setting here is saved and used whenever this one is chosen.</p>
    <div id="plan-fields"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn grow" onclick="closePlan()">Cancel</button>
      <button class="btn primary grow" onclick="closePlan()">Save</button>
    </div>
  </div>
</div>

<div class="note">PREVIEW: layout only. No port is opened and every value shown is invented.</div>

<script>
/* Prototype only. Nothing here talks to the tester API; the numbers are fixed
   samples chosen to show the amber and red states doing real work, because a
   screen of all-green proves nothing about how a failure reads at arm's length. */
const ICON = {
  TEST:'<path d="M4 17a9 9 0 1 1 16 0"/><path d="M12 17l4.6-5.2"/>',
  PINS:'<path d="M3 6h18l-1.6 12H4.6z"/><circle cx="7" cy="10" r="1.3"/><circle cx="11" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/><circle cx="19" cy="10" r="1.3"/><circle cx="9" cy="15" r="1.3"/><circle cx="13" cy="15" r="1.3"/><circle cx="17" cy="15" r="1.3"/>',
  SWEEP:'<path d="M4 20V13"/><path d="M9 20V9"/><path d="M14 20v-4"/><path d="M19 20V5"/>',
  CONTINUITY:'<path d="M2 12c3-6 5 6 8 0s5 6 8 0 4-3 4-3"/>',
  WIRING:'<path d="M9 3v6"/><path d="M15 3v6"/><path d="M6 9h12v3a6 6 0 0 1-12 0z"/><path d="M12 18v3"/>',
  SETUP:'<path d="M4 8h9"/><path d="M19 8h1"/><path d="M4 16h4"/><path d="M14 16h6"/><circle cx="16" cy="8" r="2.4"/><circle cx="10" cy="16" r="2.4"/>'
};
const SCREENS = ['TEST','PINS','SWEEP','CONTINUITY','WIRING','SETUP'];
const STATE = {TEST:['Ready','var(--good)'],PINS:['Pin check done','var(--wn)'],
  SWEEP:['Sweep complete','var(--wn)'],CONTINUITY:['Monitoring','var(--ml)'],
  WIRING:['Reference','var(--mu)'],SETUP:['Ready','var(--good)']};

const PINS = [[1,'DCD','Pass','g'],[2,'RXD','Pass','g'],[3,'TXD','Pass','g'],[4,'DTR','Pass','g'],
  [5,'GND','Ref','m'],[6,'DSR','Pass','g'],[7,'RTS','Pass','g'],[8,'CTS','Open','w'],
  [9,'RI','Not used','m']];
const RATES = [[1200,1,1,'0','1.17 kB/s'],[2400,1,1,'0','2.34 kB/s'],[4800,1,1,'0','4.69 kB/s'],
  [9600,1,1,'0','9.37 kB/s'],[19200,1,1,'0','18.7 kB/s'],[38400,1,0,'34','31.2 kB/s'],
  [57600,0,0,'291','12.4 kB/s'],[115200,0,0,'1,204','3.1 kB/s']];
const PRESETS = [
  ['Quick','Three rates, half a second each. Catches an obviously bad cable.','10 s'],
  ['Standard','All eight rates, both parities. The everyday check.','1 min'],
  ['Thorough','All eight, three passes, stress pattern. For a cable going into service.','10 min'],
  ['Custom','Whatever is set in Setup.','2 min']
];

function chip(ok){return `<span class="chip ${ok?'g':'r'}">${ok?'Pass':'Fail'}</span>`;}

function db9(){
  const col={1:'--good',2:'--good',3:'--good',4:'--good',5:'--mu',6:'--good',7:'--good',
             8:'--wn',9:'--mu'};
  let p=`<path d="M28 26 L272 26 L252 136 L48 136 Z" fill="none" stroke="var(--b2)"
          stroke-width="2.5" stroke-linejoin="round"/>`;
  const pos={};[1,2,3,4,5].forEach((n,i)=>pos[n]=[60+i*46,58]);
  [6,7,8,9].forEach((n,i)=>pos[n]=[83+i*46,104]);
  for(const n in pos){const[x,y]=pos[n],c=`var(${col[n]})`;
    p+=`<circle cx="${x}" cy="${y}" r="13" fill="${c}" fill-opacity=".28" stroke="${c}" stroke-width="2.4"/>
        <text x="${x}" y="${y+5}" text-anchor="middle" font-family="var(--mono)" font-size="13"
              font-weight="600" fill="${c}">${n}</text>`;}
  return `<svg viewBox="0 0 300 160" style="width:100%;max-width:300px">${p}</svg>`;
}

const BODY = {
TEST:()=>`
 <div class="card" style="width:322px;flex-shrink:0;align-items:center;justify-content:center;gap:2px">
   <svg viewBox="0 0 300 206" style="width:100%">
     <path d="M 54.7 187 A 110 110 0 1 1 245.3 187" fill="none" stroke="var(--bg3)"
           stroke-width="17" stroke-linecap="round"/>
     <path d="M 54.7 187 A 110 110 0 1 1 245.3 187" fill="none" stroke="var(--wn)"
           stroke-width="17" stroke-linecap="round" stroke-dasharray="359.4 460.77"/>
     <text x="150" y="156" text-anchor="middle" font-family="var(--disp)" font-weight="800"
           font-size="92" fill="var(--wn)">78</text>
   </svg>
   <div style="font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;
        text-transform:uppercase;color:var(--mu)">Health score</div>
 </div>
 <div class="grow" style="display:flex;flex-direction:column;gap:11px;min-width:0">
   <div class="card">
     <div class="verdict">Usable, with reservations</div>
     <div class="verdict-sub">Every pin passed. Clean to 19200 baud, errors above it.
       Fine for a 9600 link, not for 115200.</div>
   </div>
   <div class="grow"></div>
   <button class="btn primary big">Run pin check<small>Two seconds</small></button>
   <button class="btn big" onclick="openModal()">Run baud sweep<small>Choose a setting</small></button>
 </div>`,

PINS:()=>`
 <div class="card" style="width:340px;flex-shrink:0">
   <h2>Plug, male view</h2>
   <div style="display:flex;justify-content:center">${db9()}</div>
   <div class="grow"></div>
   <div class="row">
     <button class="btn primary grow">Male</button><button class="btn grow">Female</button>
   </div>
 </div>
 <div class="card grow">
   <h2>Pin results <em class="w">1 open</em></h2>
   ${PINS.map(([n,s,v,c])=>`<div class="trow">
      <span class="mono" style="width:22px;color:var(--mu)">${n}</span>
      <span style="width:54px;font-weight:500">${s}</span><span class="grow"></span>
      <span class="${c}" style="font-size:11.5px;font-weight:700;letter-spacing:.09em;
            text-transform:uppercase">${v}</span>
      <span class="dot ${c}" style="background:currentColor;margin-left:11px"></span>
    </div>`).join('')}
 </div>`,

SWEEP:()=>`
 <div class="card grow">
   <h2>Baud sweep <em>Standard &middot; 5 of 8 clean</em></h2>
   <div class="thead"><span style="width:104px">Rate</span><span style="width:126px">No parity</span>
     <span style="width:126px">Even parity</span><span style="width:96px">Errors</span>
     <span style="width:116px">Throughput</span><span class="grow">Quality</span></div>
   ${RATES.map(([r,a,b,e,t])=>{const cl=a&&b?'--good':(a?'--wn':'--bad'),
      f=a&&b?100:(a?52:12);return `<div class="trow">
      <span class="mono" style="width:104px;font-size:16px">${r.toLocaleString()}</span>
      <span style="width:126px">${chip(a)}</span><span style="width:126px">${chip(b)}</span>
      <span class="mono ${e==='0'?'m':'r'}" style="width:96px">${e}</span>
      <span class="mono m" style="width:116px">${t}</span>
      <span class="bar"><i style="width:${f}%;background:var(${cl})"></i></span></div>`}).join('')}
   <div class="grow"></div>
   <div class="row" style="align-items:center">
     <span style="font-family:var(--disp);font-weight:700;font-size:16px;color:var(--wn)">
       Clean to 19200. Degrades above it.</span>
     <span class="grow"></span>
     <button class="btn" style="width:180px" onclick="openModal()">Sweep settings</button>
     <button class="btn primary" style="width:150px">Run again</button>
   </div>
 </div>`,

CONTINUITY:()=>`
 <div class="card grow" style="align-items:stretch">
   <h2>Continuity <em class="m" id="wig-el">00:45 elapsed</em></h2>
   <div class="wig" id="wig">
     <div class="prompt">Move the cable
       <small>Flex it at both connectors, at the strain reliefs, and along its length.</small>
     </div>
     <div style="height:14px"></div>
     <div class="state" id="wig-state">HOLDING</div>
     <div style="display:flex;align-items:baseline;gap:12px;justify-content:center">
       <span class="count" id="wig-n">0</span>
       <span class="lbl" style="font-size:15px">dropouts</span>
     </div>
   </div>
   <div class="row"><button class="btn primary grow" style="height:64px">Stop and record</button></div>
 </div>
 <div class="card" style="width:284px;flex-shrink:0">
   <h2>Events</h2>
   <div class="log" id="wig-log"></div>
 </div>`,

WIRING:()=>`
 <div class="card grow"><h2>Male shell</h2>
   <div style="display:flex;justify-content:center">${db9()}</div>
   <div style="font-size:13px;color:var(--mu);margin-top:8px">Pin numbers are moulded into the
     plastic. Go by those, not by position.</div></div>
 <div class="card grow"><h2>Jumpers</h2>
   ${[['2 to 3','Data','--wire-data'],['7 to 8','Flow control','--wire-flow'],
      ['4 to 1 to 6','Modem status','--wire-modem']].map(([p,n,c])=>`
     <div class="trow"><span style="width:26px;height:4px;border-radius:2px;
       background:var(${c});margin-right:13px"></span>
       <span class="mono" style="width:106px">${p}</span>
       <span style="color:var(--mu)">${n}</span></div>`).join('')}
   <div class="trow" style="border:0"><span style="color:var(--mu);font-size:13px">
     Pin 9 is left unconnected.</span></div>
   <div class="grow"></div>
   <div style="font-size:13px;color:var(--mu);line-height:1.45">Use the shortest jumpers that
     will reach. Long loops inside the shell pick up noise and can make a good cable look
     marginal at 115200.</div></div>`,

SETUP:()=>`
 <div class="card grow">
   <h2>Sweep settings <em>Tap to edit</em></h2>
   ${PRESETS.map(([n,d,t],i)=>`
     <button class="preset" style="margin-bottom:8px;height:66px" onclick="openPlan(${i})">
       <span class="nm" style="font-size:17px;width:104px">${n}</span>
       <span class="ds">${d}</span><span class="tm">${t}</span>
       <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2"
            stroke-linecap="round" style="opacity:1"><path d="M9 5l7 7-7 7"/></svg>
     </button>`).join('')}
   <div class="grow"></div>
   <button class="btn">Reset all to factory</button>
 </div>
 <div class="card" style="width:340px;flex-shrink:0">
   <h2>Instrument</h2>
   ${[['Settle time','120 ms'],['Serial adapter','FTDI FT232R']].map(([k,v])=>`
     <div class="trow"><span style="flex-grow:1;font-size:14.5px">${k}</span>
       <span class="mono m" style="font-size:15px">${v}</span></div>`).join('')}
   <div class="trow" style="border:0"><span style="flex-grow:1;font-size:14.5px">Display</span></div>
   <div class="row"><button class="btn primary grow">Dark</button>
     <button class="btn grow">Light</button></div>
   <div class="grow"></div>
   <div class="row"><button class="btn grow">Export</button>
     <button class="btn primary grow">Print</button></div>
 </div>`
};

/* ── ethernet ──────────────────────────────────────────────────────────
   The nine-pin model does not carry over. Ethernet is four twisted pairs,
   and which pairs a link needs depends on the speed: 10 and 100 use only
   1-2 and 3-6, gigabit needs all four. That is what makes a speed ladder
   diagnostic rather than merely a benchmark, and it is why "links at 100
   but not 1000" localises the fault to the blue and brown pairs. */
const PAIRS = [
  ['1',  '1, 2', 'Orange',      '#e08a3c', 'half',  'Pass','g'],
  ['2',  '3, 6', 'Green',       '#3faa62', 'half',  'Pass','g'],
  ['3',  '4, 5', 'Blue',        '#4f7fd6', 'half',  'Open','w'],
  ['4',  '7, 8', 'Brown',       '#9a6b4a', 'half',  'Pass','g']
];
const SPEEDS = [
  [10,   1, '0',  '1.19 MB/s', 'Pairs 1-2 and 3-6 only'],
  [100,  1, '0',  '11.8 MB/s', 'Pairs 1-2 and 3-6 only'],
  [1000, 0, '--', '--',        'Needs all four pairs']
];
/* Standard-independent: T568A and T568B swap the orange and green pairs
   wholesale, so the physical connection is identical either way. */
const LOOP = [
  ['White/Orange','White/Green','1 to 3','#e08a3c','#3faa62'],
  ['Orange','Green','2 to 6','#e08a3c','#3faa62'],
  ['Blue','White/Brown','4 to 7','#4f7fd6','#9a6b4a'],
  ['White/Blue','Brown','5 to 8','#4f7fd6','#9a6b4a']
];

function swatch(c,style){return `<span class="sw ${style}" style="--c:${c}"></span>`;}

const ETH = {
TEST:()=>`
 <div class="card" style="width:322px;flex-shrink:0;align-items:center;justify-content:center;gap:2px">
   <svg viewBox="0 0 300 206" style="width:100%">
     <path d="M 54.7 187 A 110 110 0 1 1 245.3 187" fill="none" stroke="var(--bg3)"
           stroke-width="17" stroke-linecap="round"/>
     <path d="M 54.7 187 A 110 110 0 1 1 245.3 187" fill="none" stroke="var(--wn)"
           stroke-width="17" stroke-linecap="round" stroke-dasharray="299.5 460.77"/>
     <text x="150" y="156" text-anchor="middle" font-family="var(--disp)" font-weight="800"
           font-size="92" fill="var(--wn)">65</text>
   </svg>
   <div style="font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;
        text-transform:uppercase;color:var(--mu)">Health score</div>
 </div>
 <div class="grow" style="display:flex;flex-direction:column;gap:11px;min-width:0">
   <div class="card">
     <div class="verdict">100 Mb only</div>
     <div class="verdict-sub">Links clean at 10 and 100. Will not link at 1000.
       The blue and brown pairs are not carrying. Usable for a 100 Mb run, not for gigabit.</div>
   </div>
   <div class="grow"></div>
   <button class="btn primary big">Check pairs<small>Two seconds</small></button>
   <button class="btn big" onclick="openModal()">Run speed sweep<small>Choose a setting</small></button>
 </div>`,

PAIRS:()=>`
 <div class="card" style="width:340px;flex-shrink:0">
   <h2>Pairs</h2>
   <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
     ${PAIRS.map(([n,pins,name,c,st,v,cl])=>`
       <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;
            border-radius:10px;background:var(--bg3)">
         ${swatch(c,st)}
         <div style="flex-grow:1;min-width:0">
           <div style="font-size:15px;font-weight:500">${name}</div>
           <div class="mono" style="font-size:11.5px;color:var(--mu)">pins ${pins}</div></div>
         <span class="${cl}" style="font-size:11.5px;font-weight:700;letter-spacing:.09em;
               text-transform:uppercase">${v}</span></div>`).join('')}
   </div>
 </div>
 <div class="card grow">
   <h2>What this means <em class="w">1 pair open</em></h2>
   <div style="font-size:15px;line-height:1.5;color:var(--mu)">
     <p style="margin-bottom:12px"><b style="color:var(--tx)">10 and 100 Mb use only the
       orange and green pairs.</b> Both are sound, so this cable will carry a 100 Mb link
       normally and nothing will look wrong in service.</p>
     <p style="margin-bottom:12px"><b style="color:var(--tx)">Gigabit needs all four.</b>
       The blue pair is open, so 1000 Mb cannot negotiate. A device that expects gigabit
       will silently fall back to 100 and nobody will be told why.</p>
     <p>Check the blue pair at both plugs first. A pair that reads open with both ends
       terminated is usually a bad crimp, not a broken conductor.</p>
   </div>
 </div>`,

SPEED:()=>`
 <div class="card grow">
   <h2>Speed sweep <em>Standard &middot; 2 of 3 linked</em></h2>
   <div class="thead"><span style="width:130px">Speed</span><span style="width:150px">Link</span>
     <span style="width:110px">Errors</span><span style="width:140px">Throughput</span>
     <span class="grow">Pairs used</span></div>
   ${SPEEDS.map(([sp,ok,err,thr,note])=>`<div class="trow" style="height:62px">
      <span class="mono" style="width:130px;font-size:19px">${sp} Mb</span>
      <span style="width:150px">${chip(ok)}</span>
      <span class="mono ${err==='0'?'m':'r'}" style="width:110px">${err}</span>
      <span class="mono m" style="width:140px">${thr}</span>
      <span class="grow" style="font-size:13.5px;color:var(--mu)">${note}</span></div>`).join('')}
   <div class="grow"></div>
   <div class="row" style="align-items:center">
     <span style="font-family:var(--disp);font-weight:700;font-size:16px;color:var(--wn)">
       Good to 100 Mb. Will not do gigabit.</span>
     <span class="grow"></span>
     <button class="btn" style="width:180px" onclick="openModal()">Sweep settings</button>
     <button class="btn primary" style="width:150px">Run again</button>
   </div>
 </div>`,

CONTINUITY:()=>BODY.CONTINUITY(),

WIRING:()=>`
 <div class="card grow">
   <h2>Loopback, gigabit <em>1-3, 2-6, 4-7, 5-8</em></h2>
   <div style="display:flex;flex-direction:column;gap:10px;margin-top:2px">
     ${LOOP.map(([a,b,pins,ca,cb])=>`
       <div style="display:flex;align-items:center;gap:11px;height:58px;padding:0 14px;
            border-radius:10px;background:var(--bg3)">
         ${swatch(ca,a.startsWith('White')?'half':'solid')}
         <span style="width:104px;font-size:14px">${a}</span>
         <span style="color:var(--mu);font-size:17px">&harr;</span>
         ${swatch(cb,b.startsWith('White')?'half':'solid')}
         <span style="width:104px;font-size:14px">${b}</span>
         <span class="grow"></span>
         <span class="mono m" style="font-size:14px">${pins}</span></div>`).join('')}
   </div>
 </div>
 <div class="card" style="width:326px;flex-shrink:0">
   <h2>Building it</h2>
   <div style="font-size:14.5px;line-height:1.5;color:var(--mu)">
     <p style="margin-bottom:12px"><b style="color:var(--tx)">The colours are the same in
       T568A and T568B.</b> The two standards swap the orange and green pairs wholesale, so
       the connection is identical either way. You do not need to know which one your cable is.</p>
     <p style="margin-bottom:12px"><b style="color:var(--bad)">Never tie a wire to its own
       stripe partner.</b> Blue to White/Blue is a dead short across a pair, not a loopback.
       Every connection here crosses between two different pairs.</p>
     <p>A patch cable has a plug at both ends and the tester has a jack, so the loopback
       needs a female: a coupler with a stub, or a keystone jack punched down this way.</p>
   </div>
 </div>`,

SETUP:()=>BODY.SETUP()
};

/* ── wiring up ────────────────────────────────────────────────────────
   Nav and screens are rebuilt when the protocol changes. Six slots either
   way; two of them carry different content because nine pins and four pairs
   are not the same problem. */
Object.assign(ICON,{
  PAIRS:'<path d="M3 7h18"/><path d="M3 11h18"/><path d="M3 16h18"/><path d="M3 20h18"/>'+
        '<circle cx="7" cy="7" r="1.1"/><circle cx="7" cy="11" r="1.1"/>'+
        '<circle cx="7" cy="16" r="1.1"/><circle cx="7" cy="20" r="1.1"/>',
  SPEED:ICON.SWEEP
});
const NAV = {
  SERIAL:  ['TEST','PINS','SWEEP','CONTINUITY','WIRING','SETUP'],
  ETHERNET:['TEST','PAIRS','SPEED','CONTINUITY','WIRING','SETUP']
};
Object.assign(STATE,{PAIRS:['Pair check done','var(--wn)'],
                     SPEED:['Sweep complete','var(--wn)']});

let PROTO='SERIAL', CUR='TEST';
const nav=document.getElementById('nav'), screens=document.getElementById('screens');

function build(){
  const set = PROTO==='SERIAL' ? BODY : ETH;
  nav.innerHTML=''; screens.innerHTML='';
  NAV[PROTO].forEach(n=>{
    nav.insertAdjacentHTML('beforeend',
      `<button class="navbtn" data-s="${n}"><svg viewBox="0 0 24 24">${ICON[n]}</svg>${n}</button>`);
    screens.insertAdjacentHTML('beforeend',
      `<section class="screen" data-s="${n}">${set[n]()}</section>`);
  });
  if(!NAV[PROTO].includes(CUR)) CUR='TEST';
  show(CUR);
}
function show(n){
  CUR=n;
  document.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('on',e.dataset.s===n));
  document.getElementById('state').textContent=STATE[n][0];
  document.getElementById('dot').style.background=STATE[n][1];
}
nav.addEventListener('click',e=>{const b=e.target.closest('.navbtn'); if(b) show(b.dataset.s);});
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.proto===PROTO) return;
  PROTO=b.dataset.proto;
  document.querySelectorAll('#proto button').forEach(x=>x.classList.toggle('on',x===b));
  build();
});

build();
</script>
</body>
</html>
