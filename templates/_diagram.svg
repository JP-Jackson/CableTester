<svg class="diagram" viewBox="0 0 440 726" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">DB9 loopback plug wiring, male and female</title>
  <desc id="diagram-desc">The same loopback plug drawn twice, once for a male shell and once for a female shell. Pin 2 is joined to pin 3, pin 7 to pin 8, and pins 4, 1 and 6 are joined together. Pin 5 is signal ground with no jumper and pin 9 is unused. A female shell numbers its pins in the opposite left to right order from a male shell.</desc>

  <!-- ══ MALE: pin 1 at top left, 1 to 5 left to right ══════════════════ -->
  <text class="conn-label" x="220" y="20">MALE SHELL &#183; MATING FACE</text>
  <g transform="translate(0,38)">
    <path class="shell" d="M 30 76 L 410 76 L 392 218 L 48 218 Z"/>
    <path class="shell-inner" d="M 44 90 L 396 90 L 382 204 L 58 204 Z"/>

    <g class="jumpers" fill="none">
      <path class="jw j-modem" d="M 294 112 C 294 16 72 16 72 112"/>
      <path class="jw j-modem" d="M 72 112 L 109 170"/>
      <path class="jw j-data"  d="M 146 112 C 146 50 220 50 220 112"/>
      <path class="jw j-flow"  d="M 183 170 C 183 252 257 252 257 170"/>
    </g>

    <g class="pins">
      <g class="pin" data-pin="1"><circle cx="72"  cy="112" r="14"/><text x="72"  y="117">1</text></g>
      <g class="pin" data-pin="2"><circle cx="146" cy="112" r="14"/><text x="146" y="117">2</text></g>
      <g class="pin" data-pin="3"><circle cx="220" cy="112" r="14"/><text x="220" y="117">3</text></g>
      <g class="pin" data-pin="4"><circle cx="294" cy="112" r="14"/><text x="294" y="117">4</text></g>
      <g class="pin" data-pin="5"><circle cx="368" cy="112" r="14"/><text x="368" y="117">5</text></g>
      <g class="pin" data-pin="6"><circle cx="109" cy="170" r="14"/><text x="109" y="175">6</text></g>
      <g class="pin" data-pin="7"><circle cx="183" cy="170" r="14"/><text x="183" y="175">7</text></g>
      <g class="pin" data-pin="8"><circle cx="257" cy="170" r="14"/><text x="257" y="175">8</text></g>
      <g class="pin" data-pin="9"><circle cx="331" cy="170" r="14"/><text x="331" y="175">9</text></g>
    </g>

    <g class="siglabels">
      <text x="72"  y="140">DCD</text>
      <text x="146" y="140">RXD</text>
      <text x="220" y="140">TXD</text>
      <text x="294" y="140">DTR</text>
      <text x="368" y="140">GND</text>
      <text x="109" y="197">DSR</text>
      <text x="183" y="197">RTS</text>
      <text x="257" y="197">CTS</text>
      <text x="331" y="197">RI</text>
    </g>
  </g>

  <!-- ══ FEMALE: mirrored, pin 5 at top left, 5 down to 1 left to right ══
       Same four jumpers, same logical pins. Only the geometry changes,
       which is exactly the mistake this second drawing exists to stop
       someone making while the plug is in their hand. ═══════════════════ -->
  <text class="conn-label" x="220" y="330">FEMALE SHELL &#183; MATING FACE</text>
  <g transform="translate(0,346)">
    <path class="shell" d="M 30 76 L 410 76 L 392 218 L 48 218 Z"/>
    <path class="shell-inner" d="M 44 90 L 396 90 L 382 204 L 58 204 Z"/>

    <g class="jumpers" fill="none">
      <path class="jw j-modem" d="M 146 112 C 146 16 368 16 368 112"/>
      <path class="jw j-modem" d="M 368 112 L 331 170"/>
      <path class="jw j-data"  d="M 294 112 C 294 50 220 50 220 112"/>
      <path class="jw j-flow"  d="M 257 170 C 257 252 183 252 183 170"/>
    </g>

    <g class="pins">
      <g class="pin" data-pin="5"><circle cx="72"  cy="112" r="14"/><text x="72"  y="117">5</text></g>
      <g class="pin" data-pin="4"><circle cx="146" cy="112" r="14"/><text x="146" y="117">4</text></g>
      <g class="pin" data-pin="3"><circle cx="220" cy="112" r="14"/><text x="220" y="117">3</text></g>
      <g class="pin" data-pin="2"><circle cx="294" cy="112" r="14"/><text x="294" y="117">2</text></g>
      <g class="pin" data-pin="1"><circle cx="368" cy="112" r="14"/><text x="368" y="117">1</text></g>
      <g class="pin" data-pin="9"><circle cx="109" cy="170" r="14"/><text x="109" y="175">9</text></g>
      <g class="pin" data-pin="8"><circle cx="183" cy="170" r="14"/><text x="183" y="175">8</text></g>
      <g class="pin" data-pin="7"><circle cx="257" cy="170" r="14"/><text x="257" y="175">7</text></g>
      <g class="pin" data-pin="6"><circle cx="331" cy="170" r="14"/><text x="331" y="175">6</text></g>
    </g>

    <g class="siglabels">
      <text x="72"  y="140">GND</text>
      <text x="146" y="140">DTR</text>
      <text x="220" y="140">TXD</text>
      <text x="294" y="140">RXD</text>
      <text x="368" y="140">DCD</text>
      <text x="109" y="197">RI</text>
      <text x="183" y="197">CTS</text>
      <text x="257" y="197">RTS</text>
      <text x="331" y="197">DSR</text>
    </g>
  </g>

  <g class="caption">
    <text x="220" y="638">Both views look at the mating face, the end that plugs in.</text>
    <text x="220" y="654">Soldering the back of a shell? Use the other drawing: a male shell's</text>
    <text x="220" y="670">solder side matches the female view, and a female's matches the male.</text>
    <text x="220" y="690">Pin numbers are moulded into the plastic: go by those, not by position.</text>
    <text x="220" y="716" class="cap-key">
      <tspan class="k-data">&#9632;</tspan> 2-3 data
      <tspan class="k-flow">&#9632;</tspan> 7-8 flow
      <tspan class="k-modem">&#9632;</tspan> 4-1-6 modem
      <tspan class="k-none">&#9632;</tspan> 9 unused
    </text>
  </g>
</svg>
