<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<title>Cable Tester &middot; Polk Production Technologies, Inc.</title>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='hmi.css') }}">
</head>
<body>

<!-- The shell is fixed: rail, status bar, one screen at a time. Screens are
     built by hmi.js rather than written out here, because the nav and its
     content change with the protocol and two hand-maintained sets would
     drift. What lives in the markup is only what the server has to fill in. -->
<div class="hmi">

  <nav class="rail">
    <div class="mark">
      <svg viewBox="0 0 100 100" width="40" height="40" aria-hidden="true">
        <rect x="2" y="2" width="96" height="96" rx="22" fill="#8a2a4c"/>
        <text x="50" y="66" text-anchor="middle" font-family="Barlow Condensed, sans-serif"
              font-size="46" font-weight="800" fill="#fff" letter-spacing="1">PPT</text>
      </svg>
    </div>
    <div class="items" id="nav"></div>
    <button class="ver" id="ver-btn">
      <b>{{ version }}</b><span>Version</span>
    </button>
  </nav>

  <div class="main">
    <div class="status">
      <div class="fld" style="width:208px">
        <b>Port</b>
        <select id="port"><option value="">Scanning</option></select>
      </div>
      <div class="fld" style="width:152px">
        <b>Cable ID</b>
        <input id="cable-id" type="text" placeholder="e.g. XFC-07" autocomplete="off">
      </div>
      <button class="btn" id="refresh" style="width:120px;height:44px">Refresh</button>
      <div class="grow"></div>
      {% if simulating %}<span class="pill" style="color:var(--wn)">Simulation</span>{% endif %}
      <div class="seg" id="proto">
        <button class="on" data-proto="SERIAL">Serial</button>
        <button data-proto="ETHERNET">Ethernet</button>
      </div>
      <div class="pill"><span class="lamp" id="lamp"></span><span id="state">Ready</span></div>
    </div>

    <div class="screens" id="screens"></div>
  </div>
</div>

<!-- Version history. The one place in this UI permitted to describe the past;
     see the carve-out in CLAUDE.md before deleting it on the strength of the
     rule that everything else here describes the instrument as it is. -->
<div class="sheet" id="sheet">
  <div class="sheet-bar">
    <h3>Version history</h3>
    <div class="grow"></div>
    <button class="btn" style="width:150px" id="sheet-close">Close</button>
  </div>
  <div class="sheet-body">
    {% for v in versions %}
    <div class="rel">
      <div class="rel-head">
        <b>{{ v.version }}</b><em>{{ v.title }}</em>
        {% if loop.first %}<span class="now">Running now</span>{% endif %}
        <span>{{ v.released_display }}</span>
      </div>
      <ul>{% for n in v.notes %}<li>{{ n }}</li>{% endfor %}</ul>
    </div>
    {% endfor %}
  </div>
</div>

<script>
  // Server-known facts the page would otherwise have to fetch before it could
  // draw anything. Kept to constants: everything that changes comes from the API.
  window.CT = {
    bauds: {{ baud_rates | tojson }},
    weights: {{ weights | tojson }},
    simulating: {{ simulating | tojson }},
    version: {{ version | tojson }}
  };
</script>
<script src="{{ url_for('static', filename='hmi.js') }}"></script>
</body>
</html>
